<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나래온 리모트 · 여러 태블릿</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><h1>나래온 리모트</h1><p>여러 태블릿 화면 · 기기별 제어</p></div><nav><button id="start-all">모두 보기 시작</button><button id="stop-all" class="danger">전체 관제 중지</button></nav></header>
<aside>기존 나래온 MCP를 통한 주기적 캡처입니다. 영상 스트리밍이 아니며, 지연은 네트워크와 기기 상태에 따라 달라집니다. 화면은 이 PC의 메모리에서만 처리합니다. 다른 Wi-Fi도 가능하며 ADB·개발자 옵션은 필요 없습니다.</aside>
<p id="notice" role="status">관제 연결 확인 중…</p><main id="grid"></main>
<template id="device-card"><section class="card"><header><h2></h2><button class="expand">크게 보기</button></header><p class="status" role="status">중지됨 · 화면 보기 시작을 누르세요.</p><div class="screen"><img alt="아직 화면을 받지 않았습니다" draggable="false" hidden><span class="empty">태블릿 화면 대기</span></div><div class="buttons"><button class="start">화면 보기 시작</button><button class="stop">보기 중지</button><button class="arm">이 기기 제어권 확인·인계</button></div><p class="control-state">관찰 전용 · 제어권 자동 인계 없음</p><div class="controls"><button data-action="home">홈</button><button data-action="back">뒤로</button><select class="scroll-target" aria-label="스크롤 영역"><option value="">스크롤 영역</option></select><button data-action="scroll_backward">위로 스크롤</button><button data-action="scroll_forward">아래로 스크롤</button></div><form class="typing"><select class="edit-target" aria-label="입력란"><option value="">입력란 선택</option></select><input class="text" type="text" maxlength="5000" placeholder="선택한 입력란에 넣을 문장" autocomplete="off" aria-label="입력할 문장"><button type="submit">문장 입력</button></form><small>제어권 인계 후 화면 클릭으로 터치합니다. 조작은 한 번만 보내며 결과는 다음 화면에서 확인하세요. 실패 시 이 기기 관제만 멈춥니다. 기기에서 허용한 앱·정책만 사용할 수 있습니다.</small></section></template>
</body></html>
